<title>Prodify Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: header bersih dengan sapaan besar, kartu "berikutnya" warna lime, lalu form di kiri dan kalender + tugas di kanan. */
:root{
  --bg:#f3f5ff; --surface:#ffffff; --surface2:#e6eaff; --fg:#1b2147; --muted:#5b6286; --line:#d5dbf5;
  --accent:#3d5afe; --on-accent:#ffffff; --accent-text:#2943d6;
  --lime:#ffc2dd; --on-lime:#3a0f26;
  --hot:#c81e4d; --on-hot:#ffffff; --ok:#2f9e6e; --mid:#a86a00; --low:#2f6fd0;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12142b; --surface:#1b1f3d; --surface2:#252a4d; --fg:#eef0ff; --muted:#9aa2cf; --line:#2f3562;
    --accent:#8da2ff; --on-accent:#0f1433; --accent-text:#9db0ff; --lime:#ff9fcb; --on-lime:#3a0f26;
    --hot:#ff7b9c; --on-hot:#2a0a14; --ok:#5fd9a0; --mid:#f0c24b; --low:#8da2ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12142b; --surface:#1b1f3d; --surface2:#252a4d; --fg:#eef0ff; --muted:#9aa2cf; --line:#2f3562;
  --accent:#8da2ff; --on-accent:#0f1433; --accent-text:#9db0ff; --lime:#ff9fcb; --on-lime:#3a0f26;
  --hot:#ff7b9c; --on-hot:#2a0a14; --ok:#5fd9a0; --mid:#f0c24b; --low:#8da2ff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* HEADER */
.hero{max-width:1080px;margin:0 auto;padding-top:20px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.tag{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 10px;border-radius:999px;letter-spacing:.02em}
.theme{margin-left:auto;cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.theme:hover{border-color:var(--fg)}
.hero h1{font-size:clamp(34px,6.4vw,64px);line-height:1.02;font-weight:800;letter-spacing:-.025em;margin:34px 0 12px;max-width:16ch}
.hero h1 em{font-style:normal;background:var(--lime);color:var(--on-lime);padding:0 .12em;border-radius:.14em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{max-width:52ch;margin:0;color:var(--muted);font-size:16.5px}

/* STRIP */
.strip{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;
  background:var(--lime);color:var(--on-lime);padding:18px 22px;border-radius:16px;font-weight:700}
.strip .lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.strip .big{font-family:var(--display);font-weight:800;font-size:clamp(17px,3vw,24px);min-width:0;overflow-wrap:anywhere;line-height:1.2}
.strip .cd{font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,40px);letter-spacing:-.02em}
.strip.late{background:var(--hot);color:var(--on-hot)}

/* GRID */
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;margin-top:24px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);padding:22px;border-radius:16px}
.panel h2{font-size:17px;margin-bottom:16px;font-weight:800;letter-spacing:-.01em}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.panel label:first-of-type{margin-top:0}
input[type=text],input[type=search],input[type=datetime-local],select{width:100%;background:var(--bg);border:1px solid var(--line);padding:10px 12px;border-radius:10px}
input:focus,select:focus{border-color:var(--fg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{cursor:pointer;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;padding:13px 16px;border-radius:12px;width:100%;margin-top:18px;font-size:15px}
.btn:hover{opacity:.88}
.ghost{cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700}
.ghost:hover{border-color:var(--fg)}
.ghost.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:20px}

/* STATS */
.stats{display:flex;gap:22px;align-items:center}
.ring{flex:none;width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:var(--surface2);stroke-width:11}
.ring .p{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px}
.nums{display:grid;gap:6px;font-size:14px;min-width:0;flex:1}
.nums div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:4px}
.nums strong{font-variant-numeric:tabular-nums}
.nums .late strong{color:var(--hot)}

/* WEEK */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:20px}
.day{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:9px 2px;text-align:center;border-radius:12px;display:flex;flex-direction:column;gap:2px;align-items:center}
.day small{font-size:11px;text-transform:capitalize;color:var(--muted);font-weight:700}
.day b{font-family:var(--display);font-weight:800;font-size:18px}
.day i{font-style:normal;font-size:11px;font-weight:700;min-width:20px;border-radius:999px;padding:0 6px;background:var(--surface2);color:var(--muted)}
.day i.has{background:var(--lime);color:var(--on-lime)}
.day:hover{border-color:var(--fg)}
.day[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day[aria-pressed=true] small{color:inherit;opacity:.75}
.day.today small::after{content:" \00b7"}

/* TOOLBAR */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.bar h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:6px 14px;font-size:13px;font-weight:700;border-radius:999px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filters input{flex:1 1 180px;width:auto}
.filters select{flex:0 1 180px;width:auto}

/* TASKS */
.grp{margin:24px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;gap:10px;align-items:center}
.grp.late{color:var(--hot)}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task.overdue{border-color:var(--hot)}
.task.editing{display:block}
.ed{display:grid;gap:8px}
.chk{width:26px;height:26px;border:2px solid var(--muted);background:transparent;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--on-accent);font-weight:800;font-size:14px}
.chk:hover{border-color:var(--accent)}
.chk[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.ttl{font-weight:700;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;align-items:center}
.meta .rel{font-weight:700;color:var(--accent-text)}
.task.overdue .meta .rel{color:var(--hot)}
.pill{font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid currentColor;text-transform:capitalize}
.pill.tinggi{color:var(--hot)}.pill.sedang{color:var(--mid)}.pill.rendah{color:var(--low)}
.acts{display:flex;gap:6px}
.acts .ghost{padding:6px 10px;font-size:12px}
@media(max-width:560px){.task{grid-template-columns:auto minmax(0,1fr)}.acts{grid-column:1/-1;justify-content:flex-end}}
.empty{padding:28px 18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;margin-top:16px}
.demo{font-size:12.5px;color:var(--muted);margin:12px 0 0}

/* HOW IT WORKS */
.how{margin:52px 0 40px}
.how h2{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.how>p{color:var(--muted);margin:0 0 22px;max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:700px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.step h3{font-size:16px;font-weight:800;margin-bottom:6px}
.step p{margin:0;font-size:14px;color:var(--muted)}
footer{padding:20px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* TOAST */
#toasts{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;z-index:20}
.toast{pointer-events:auto;max-width:420px;width:100%;background:var(--fg);color:var(--bg);padding:13px 16px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;gap:12px;justify-content:space-between;align-items:flex-start;font-weight:600;animation:in .25s}
.toast.late{background:var(--hot);color:var(--on-hot)}
.toast button{background:none;border:0;cursor:pointer;font-weight:800;color:inherit;padding:0 4px}
@keyframes in{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}.ring .p{transition:none}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function(){
  var useState=React.useState,useEffect=React.useEffect,useMemo=React.useMemo,useRef=React.useRef,h=React.createElement;
  var KEY='prodify-planner-v1',CATS=['Kuliah','Proyek','Organisasi','Pribadi'];

  /* ---------- helpers ---------- */
  function pad(n){return String(n).padStart(2,'0')}
  function toLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function fmt(d){return d.toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
  function rel(ms){
    var a=Math.abs(ms),m=Math.floor(a/60000),hh=Math.floor(m/60),d=Math.floor(hh/24),t;
    if(d>=1)t=d+' hari '+(hh%24)+' j';else if(hh>=1)t=hh+' j '+(m%60)+' m';else t=m+' menit';
    return ms>=0?'dalam '+t:'terlambat '+t;
  }
  function clock(ms){
    var s=Math.floor(Math.abs(ms)/1000),hh=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
    return (hh?pad(hh)+':':'')+pad(m)+':'+pad(r);
  }
  function seed(){
    var n=Date.now(),tm=new Date(n),d2=new Date(n+2*86400000);
    tm.setDate(tm.getDate()+1);tm.setHours(9,0,0,0);d2.setHours(23,0,0,0);
    function mk(title,due,p,c){return{id:uid(),title:title,due:toLocal(due),prio:p,cat:c,done:false,soon:false,over:false}}
    return{sample:true,lead:15,tasks:[
      mk('Kumpulkan laporan praktikum JavaScript',new Date(n+22*60000),'tinggi','Kuliah'),
      mk('Rapikan komponen kartu tugas di React',new Date(n+4*3600000),'sedang','Proyek'),
      mk('Rapat evaluasi tim Finpro',tm,'sedang','Organisasi'),
      mk('Baca dokumentasi API notifikasi',d2,'rendah','Proyek'),
      mk('Balas pesan dosen pembimbing',new Date(n-90*60000),'tinggi','Kuliah')]};
  }
  function loadState(){
    try{
      var raw=localStorage.getItem(KEY)||localStorage.getItem('exercise-planner-v1');
      if(raw){var o=JSON.parse(raw);if(Array.isArray(o.tasks))return{tasks:o.tasks,lead:o.lead||15,sample:!!o.sample}}
    }catch(e){}
    return seed();
  }
  function useNow(ms){
    var s=useState(Date.now()),n=s[0],set=s[1];
    useEffect(function(){var i=setInterval(function(){set(Date.now())},ms);return function(){clearInterval(i)}},[ms]);
    return n;
  }
  function toggleTheme(){
    var el=document.documentElement,cur=el.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
    var next=cur==='light'?'dark':'light';el.setAttribute('data-theme',next);
    try{localStorage.setItem('prodify-theme',next)}catch(e){}
  }
  try{var th=localStorage.getItem('prodify-theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}

  /* ---------- komponen ---------- */
  function Hero(){
    return h('header',{className:'hero'},
      h('div',{className:'brand'},
        h('span',{className:'logo','aria-hidden':'true'},h('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:3,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M5 12.5l4.5 4.5L19 7'}))),
        'Prodify',h('span',{className:'tag'},'Planner otomatis'),
        h('button',{className:'theme',type:'button',onClick:toggleTheme,'aria-label':'Ganti tema terang atau gelap'},'Ganti tema')),
      h('h1',null,'Atur harimu, biar ',h('em',null,'pengingat'),' yang kerja.'),
      h('p',null,'Catat tugas dan tenggat. Prodify menghitung mundur dan membunyikan pengingat sebelum waktunya habis.'));
  }

  function Strip(p){
    var act=p.tasks.filter(function(t){return !t.done}).sort(function(a,b){return new Date(a.due)-new Date(b.due)});
    var up=act.filter(function(t){return new Date(t.due)>=p.now})[0];
    var late=act.filter(function(t){return new Date(t.due)<p.now});
    var cls='strip',lbl,title,cd;
    if(up){lbl='Tenggat berikutnya';title=up.title;cd=clock(new Date(up.due)-p.now)}
    else if(late.length){cls+=' late';lbl='Perlu ditangani';title=late.length+' tugas terlambat';cd='-'+clock(p.now-new Date(late[0].due))}
    else{lbl='Semua beres';title='Tidak ada tugas aktif';cd='--:--'}
    return h('div',{className:cls,role:'status','aria-live':'polite'},h('div',null,h('div',{className:'lbl'},lbl),h('div',{className:'big'},title)),h('div',{className:'cd'},cd));
  }

  function defaultDue(){var d=new Date(Date.now()+3600000);d.setMinutes(0,0,0);return toLocal(d)}
  function Form(p){
    var a=useState(''),title=a[0],setTitle=a[1],b=useState(defaultDue()),due=b[0],setDue=b[1],
        c=useState('sedang'),prio=c[0],setPrio=c[1],d=useState('Kuliah'),cat=d[0],setCat=d[1];
    function submit(e){
      e.preventDefault();if(!title.trim()||!due)return;
      p.onAdd({id:uid(),title:title.trim(),due:due,prio:prio,cat:cat,done:false,soon:false,over:false});
      setTitle('');setDue(defaultDue());
    }
    return h('section',{className:'panel','aria-labelledby':'hAdd'},h('h2',{id:'hAdd'},'Tugas baru'),
      h('form',{onSubmit:submit,autoComplete:'off'},
        h('label',{htmlFor:'fTitle'},'Nama tugas'),
        h('input',{type:'text',id:'fTitle',value:title,onChange:function(e){setTitle(e.target.value)},placeholder:'Mis. Kumpulkan laporan akhir',maxLength:120,required:true}),
        h('label',{htmlFor:'fDue'},'Tenggat'),
        h('input',{type:'datetime-local',id:'fDue',value:due,onChange:function(e){setDue(e.target.value)},required:true}),
        h('div',{className:'row2'},
          h('div',null,h('label',{htmlFor:'fPrio'},'Prioritas'),h('select',{id:'fPrio',value:prio,onChange:function(e){setPrio(e.target.value)}},['tinggi','sedang','rendah'].map(function(x){return h('option',{key:x,value:x},x.charAt(0).toUpperCase()+x.slice(1))}))),
          h('div',null,h('label',{htmlFor:'fCat'},'Kategori'),h('select',{id:'fCat',value:cat,onChange:function(e){setCat(e.target.value)}},CATS.map(function(x){return h('option',{key:x},x)})))),
        h('button',{className:'btn',type:'submit'},'TAMBAH KE PLANNER')));
  }

  function Progress(p){
    var tot=p.tasks.length,done=p.tasks.filter(function(t){return t.done}).length,
        late=p.tasks.filter(function(t){return !t.done&&new Date(t.due)<p.now}).length,pc=tot?done/tot:0;
    return h('section',{className:'panel','aria-labelledby':'hProg'},h('h2',{id:'hProg'},'Progres'),
      h('div',{className:'stats'},
        h('div',{className:'ring'},
          h('svg',{viewBox:'0 0 120 120','aria-hidden':'true'},h('circle',{className:'t',cx:60,cy:60,r:50}),
            h('circle',{className:'p',cx:60,cy:60,r:50,strokeDasharray:314.16,strokeDashoffset:314.16*(1-pc)})),
          h('b',null,Math.round(pc*100)+'%')),
        h('div',{className:'nums'},
          h('div',null,h('span',null,'Total'),h('strong',null,tot)),
          h('div',null,h('span',null,'Selesai'),h('strong',null,done)),
          h('div',{className:'late'},h('span',null,'Terlambat'),h('strong',null,late)))));
  }

  function Reminder(p){
    return h('section',{className:'panel','aria-labelledby':'hRem'},h('h2',{id:'hRem'},'Pengingat otomatis'),
      h('label',{htmlFor:'fLead'},'Ingatkan sebelum tenggat'),
      h('select',{id:'fLead',value:p.lead,onChange:function(e){p.onLead(+e.target.value)}},
        [[5,'5 menit'],[15,'15 menit'],[30,'30 menit'],[60,'1 jam'],[180,'3 jam']].map(function(o){return h('option',{key:o[0],value:o[0]},o[1])})),
      h('p',{style:{fontSize:13,color:'var(--muted)',margin:'12px 0 0'}},'Semua tugas diperiksa tiap 5 detik selama halaman terbuka. Pengingat muncul saat tenggat mendekat atau terlewat.'),
      h('button',{className:'ghost',type:'button',onClick:p.onCopy,style:{marginTop:12,width:'100%'}},'Salin agenda hari ini'));
  }

  function Week(p){
    var days=[];
    for(var i=0;i<7;i++){var d=new Date(p.now+i*86400000);days.push({d:d,key:toLocal(d).slice(0,10)})}
    return h('div',{className:'week',role:'group','aria-label':'Kalender 7 hari'},days.map(function(x,i){
      var n=p.tasks.filter(function(t){return !t.done&&t.due.slice(0,10)===x.key}).length;
      return h('button',{key:x.key,type:'button',className:'day'+(i===0?' today':''),'aria-pressed':p.day===x.key,
        'aria-label':x.d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})+', '+n+' tugas aktif',
        onClick:function(){p.onDay(p.day===x.key?null:x.key)}},
        h('small',null,x.d.toLocaleDateString('id-ID',{weekday:'short'})),h('b',null,x.d.getDate()),h('i',{className:n?'has':''},n));
    }));
  }

  function TaskItem(p){
    var t=p.t,e=useState(false),ed=e[0],setEd=e[1],a=useState(t.title),title=a[0],setTitle=a[1],b=useState(t.due),due=b[0],setDue=b[1];
    var d=new Date(t.due),ms=d-p.now,over=!t.done&&ms<0;
    if(ed)return h('article',{className:'task editing p-'+t.prio},h('div',{className:'ed'},
      h('input',{type:'text',value:title,maxLength:120,'aria-label':'Nama tugas',onChange:function(x){setTitle(x.target.value)}}),
      h('input',{type:'datetime-local',value:due,'aria-label':'Tenggat',onChange:function(x){setDue(x.target.value)}}),
      h('div',{className:'acts'},
        h('button',{className:'ghost on',type:'button',onClick:function(){if(title.trim()&&due){p.a.save(t.id,{title:title.trim(),due:due,soon:false,over:false});setEd(false)}}},'Simpan'),
        h('button',{className:'ghost',type:'button',onClick:function(){setEd(false)}},'Batal'))));
    return h('article',{className:'task p-'+t.prio+(t.done?' done':'')+(over?' overdue':'')},
      h('button',{className:'chk',type:'button',role:'checkbox','aria-checked':t.done,'aria-label':'Tandai selesai: '+t.title,onClick:function(){p.a.toggle(t.id)}},t.done?'✓':null),
      h('div',{style:{minWidth:0}},h('div',{className:'ttl'},t.title),
        h('div',{className:'meta'},h('span',null,fmt(d)),h('span',null,t.cat),h('span',{className:'pill '+t.prio},t.prio),!t.done&&h('span',{className:'rel'},rel(ms)))),
      h('div',{className:'acts'},
        !t.done&&h('button',{className:'ghost',type:'button',title:'Tunda satu jam',onClick:function(){p.a.snooze(t.id)}},'+1 j'),
        h('button',{className:'ghost',type:'button',onClick:function(){setTitle(t.title);setDue(t.due);setEd(true)}},'Ubah'),
        h('button',{className:'ghost',type:'button','aria-label':'Hapus '+t.title,onClick:function(){p.a.del(t.id)}},'Hapus')));
  }

  function Journey(){
    var items=[['1. Catat','Tulis tugas, pilih tenggat, prioritas, dan kategori. Tugas langsung tersusun menurut waktu.'],
      ['2. Pantau','Kartu hijau di atas menghitung mundur ke tenggat berikutnya, dan kalender 7 hari menunjukkan beban tiap hari.'],
      ['3. Diingatkan','Pilih berapa lama sebelum tenggat kamu ingin diingatkan. Pengingat muncul otomatis, tanpa perlu dicek manual.']];
    return h('section',{className:'how','aria-labelledby':'hJ'},h('h2',{id:'hJ'},'Cara kerja'),
      h('p',null,'Tiga langkah, semuanya di satu halaman.'),
      h('div',{className:'steps'},items.map(function(x){return h('div',{className:'step',key:x[0]},h('h3',null,x[0]),h('p',null,x[1]))})));
  }

  function App(){
    var init=useMemo(loadState,[]);
    var s1=useState(init.tasks),tasks=s1[0],setTasks=s1[1],s2=useState(init.lead),lead=s2[0],setLead=s2[1],s3=useState(init.sample),sample=s3[0];
    var s4=useState('all'),status=s4[0],setStatus=s4[1],s5=useState('all'),cat=s5[0],setCat=s5[1],s6=useState(''),q=s6[0],setQ=s6[1],s7=useState(null),day=s7[0],setDay=s7[1];
    var s8=useState([]),toasts=s8[0],setToasts=s8[1];
    var now=useNow(1000);

    useEffect(function(){try{localStorage.setItem(KEY,JSON.stringify({tasks:tasks,lead:lead,sample:sample}))}catch(e){}},[tasks,lead,sample]);

    function push(msg,late){
      var id=uid();setToasts(function(t){return t.concat({id:id,msg:msg,late:late})});
      setTimeout(function(){setToasts(function(t){return t.filter(function(x){return x.id!==id})})},12000);
    }
    var ref=useRef();ref.current={tasks:tasks,lead:lead};
    useEffect(function(){
      function run(){
        var cur=ref.current,now=Date.now(),upd={},any=false;
        cur.tasks.forEach(function(t){
          if(t.done)return;var ms=new Date(t.due)-now;
          if(ms<0&&!t.over){upd[t.id]={over:true,soon:true};any=true;push('Terlewat: '+t.title,true)}
          else if(ms>=0&&ms<=cur.lead*60000&&!t.soon){upd[t.id]={soon:true};any=true;push('Segera ('+rel(ms)+'): '+t.title,false)}
        });
        if(any)setTasks(function(prev){return prev.map(function(t){return upd[t.id]?Object.assign({},t,upd[t.id]):t})});
      }
      var first=setTimeout(run,800),i=setInterval(run,5000);
      return function(){clearTimeout(first);clearInterval(i)};
    },[]);

    var act={
      toggle:function(id){setTasks(function(p){return p.map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t})})},
      snooze:function(id){setTasks(function(p){return p.map(function(t){
        if(t.id!==id)return t;
        return Object.assign({},t,{due:toLocal(new Date(Math.max(Date.now(),new Date(t.due).getTime())+3600000)),soon:false,over:false});
      })});push('Ditunda satu jam.')},
      del:function(id){setTasks(function(p){return p.filter(function(t){return t.id!==id})})},
      save:function(id,patch){setTasks(function(p){return p.map(function(t){return t.id===id?Object.assign({},t,patch):t})});push('Perubahan disimpan.')}
    };
    function setLeadAll(v){setLead(v);setTasks(function(p){return p.map(function(t){return t.over?t:Object.assign({},t,{soon:false})})})}
    function copyAgenda(){
      var eod=new Date(now);eod.setHours(23,59,59,999);
      var rows=tasks.filter(function(t){return !t.done&&new Date(t.due)<=eod}).sort(function(a,b){return new Date(a.due)-new Date(b.due)});
      var txt='Agenda '+new Date(now).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})+'\n'+
        (rows.length?rows.map(function(t){return '- '+new Date(t.due).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' '+t.title+' ['+t.cat+']'}).join('\n'):'Tidak ada tugas aktif hari ini.');
      function fb(){push('Salin otomatis diblokir. Salin agenda secara manual.')}
      try{navigator.clipboard.writeText(txt).then(function(){push('Agenda hari ini disalin.')},fb)}catch(e){fb()}
    }

    var eod=new Date(now);eod.setHours(23,59,59,999);
    var list=tasks.filter(function(t){
      if(status==='active'&&t.done)return false;if(status==='done'&&!t.done)return false;
      if(cat!=='all'&&t.cat!==cat)return false;
      if(day&&t.due.slice(0,10)!==day)return false;
      if(q&&t.title.toLowerCase().indexOf(q.toLowerCase())<0)return false;
      return true;
    }).sort(function(a,b){return new Date(a.due)-new Date(b.due)});
    var g={late:[],today:[],next:[],done:[]};
    list.forEach(function(t){var d=new Date(t.due);if(t.done)g.done.push(t);else if(d<now)g.late.push(t);else if(d<=eod)g.today.push(t);else g.next.push(t)});
    var groups=[['late','Terlambat'],['today','Hari ini'],['next','Mendatang'],['done','Selesai']].filter(function(x){return g[x[0]].length});

    return h(React.Fragment,null,
      h(Hero),
      h('div',{className:'wrap'},
        h(Strip,{tasks:tasks,now:now}),
        h('div',{className:'grid'},
          h('div',{className:'stack'},
            h(Form,{onAdd:function(t){setTasks(function(p){return p.concat(t)});push('Tugas ditambahkan ke planner.')}}),
            h(Progress,{tasks:tasks,now:now}),
            h(Reminder,{lead:lead,onLead:setLeadAll,onCopy:copyAgenda})),
          h('section',{'aria-labelledby':'hList'},
            h(Week,{tasks:tasks,now:now,day:day,onDay:setDay}),
            h('div',{className:'bar'},
              h('h2',{id:'hList',style:{fontSize:14,fontWeight:600}},day?'Tugas pada tanggal terpilih':'Daftar tugas'),
              h('div',{className:'chips',role:'group','aria-label':'Filter status'},
                [['all','Semua'],['active','Aktif'],['done','Selesai']].map(function(x){
                  return h('button',{key:x[0],type:'button',className:'chip','aria-pressed':status===x[0],onClick:function(){setStatus(x[0])}},x[1])}))),
            h('div',{className:'filters'},
              h('input',{type:'search',value:q,placeholder:'Cari tugas...','aria-label':'Cari tugas',onChange:function(e){setQ(e.target.value)}}),
              h('select',{value:cat,'aria-label':'Filter kategori',onChange:function(e){setCat(e.target.value)}},
                [h('option',{key:'all',value:'all'},'Semua kategori')].concat(CATS.map(function(c){return h('option',{key:c},c)})))),
            sample&&h('p',{className:'demo'},'Tugas di bawah ini contoh. Hapus atau ubah sesuka Anda, lalu tambahkan tugas sendiri.'),
            groups.length?groups.map(function(x){
              return h('div',{key:x[0]},h('div',{className:'grp'+(x[0]==='late'?' late':'')},x[1]+' ('+g[x[0]].length+')'),
                g[x[0]].map(function(t){return h(TaskItem,{key:t.id,t:t,now:now,a:act})}));
            }):h('div',{className:'empty'},'Tidak ada tugas yang cocok dengan tampilan ini.'))),
        h(Journey),
        h('footer',null,h('span',null,'Dibuat oleh Alvia Setyani Putri'))),
      h('div',{id:'toasts','aria-live':'assertive'},toasts.map(function(t){
        return h('div',{key:t.id,className:'toast'+(t.late?' late':'')},h('span',null,t.msg),
          h('button',{type:'button','aria-label':'Tutup',onClick:function(){setToasts(function(p){return p.filter(function(x){return x.id!==t.id})})}},'✕'))})));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
